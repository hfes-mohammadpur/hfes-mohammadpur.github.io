.hd:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(241,217,138,.28),rgba(241,217,138,0) 70%)}
.hd:after{content:"";position:absolute;left:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 70%)}
.hd .top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.hd .dt{font-size:14px;color:#e8f6ee;font-weight:500;text-align:right;flex:1}
.lockb{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:16px;display:grid;place-items:center;cursor:pointer;flex:none}
.lockb.on{background:var(--gold);border-color:var(--gold);color:#3a2e00}
.hd .main{display:flex;align-items:center;gap:14px;margin-top:8px;position:relative;z-index:1}
.ring{width:100px;height:100px;border-radius:50%;background:#fff;border:4px solid var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.ring img{width:74px;height:auto;max-height:84px;object-fit:contain;display:block}
.hd .tag{font-size:14px;color:var(--gold2);font-weight:600;line-height:1.35}
.hd h1{margin:2px 0 0;font-size:31px;line-height:1.14;font-weight:700;letter-spacing:.1px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.nbar{display:flex;align-items:stretch;min-height:54px;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.tick{flex:1;min-width:0;background:linear-gradient(90deg,#b71c1c,#d32f2f);color:#fff;overflow:hidden;display:flex;align-items:center;cursor:pointer;position:relative}
.tick span{display:inline-block;white-space:nowrap;font-size:17px;font-weight:600;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.nbtn{flex:none;background:linear-gradient(90deg,#1d4ea1,#1a3f8a);color:#fff;border:0;padding:0 14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer}
.grid{display:grid;gap:14px;padding:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{--c:#0b6b4f;--t:#e0f3ea;position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:20px 8px 16px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;font-weight:600;font-size:19px;line-height:1.3;color:#173a2c;width:100%;transition:transform .12s}
.tile:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.tile:after{content:"";position:absolute;right:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--t);opacity:.7}
.tile:active{transform:scale(.97)}
.tile .ib{width:68px;height:68px;border-radius:50%;background:var(--t);color:var(--c);display:grid;place-items:center;font-size:32px;position:relative;z-index:1;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tile b{position:relative;z-index:1;font-weight:600}.tile small{display:block;font-size:14px;color:var(--mut);font-weight:500;margin-top:-4px;position:relative;z-index:1}
.tile.s{min-height:112px;font-size:16.5px;padding:16px 4px 12px}.tile.s .ib{width:54px;height:54px;font-size:26px}
.sec{display:flex;align-items:center;gap:12px;padding:6px 16px 0;margin-top:2px}.sec i{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}.sec i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}.sec h2{margin:0;font-size:24px;color:var(--g);font-weight:700}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:6px 16px 26px}
/* ---------- inner pages ---------- */
.pbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;background:linear-gradient(135deg,var(--pc,#0b6b4f),var(--pc2,#094c39));box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pbar h2{margin:0;font-size:20px;flex:1;line-height:1.25}.pbar h2 small{display:block;font-size:12.5px;font-weight:500;opacity:.9}
.bk{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.pb{padding:14px 12px 100px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.note{background:#fff7e0;border:1px solid #ecd48a;color:#5a4710;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:30px 12px}
.btn{border:0;background:var(--g);color:#fff;font-weight:700;border-radius:14px;padding:12px 18px;cursor:pointer;font-size:16px}.btn.sec{background:#e4efe9;color:#12352d;border:1px solid #bcd3c6}.btn.red{background:var(--red)}.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}.btn.full{width:100%}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:22px;z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#f0b429,#c9a227);color:#2f2400;font-size:30px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #edf3ef}.row:last-child{border-bottom:0}
.info{flex:1;min-width:0}.info b{display:block;font-size:17px;line-height:1.35}.info small{display:block;color:var(--mut);font-size:14px}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.acts{display:flex;gap:6px;flex:none}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid #bcd3c6;background:#e9f3ee;color:#12352d;font-size:17px;cursor:pointer;display:grid;place-items:center;text-decoration:none}.ibtn.call{background:#e1f4e7;color:#117a3a;border-color:#a8d9b7}.ibtn.red{background:#fdeaea;color:var(--red);border-color:#f0bcbc}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}.chips button{flex:none;border:1.5px solid #bcd3c6;background:#fff;color:#2b4a3c;font-weight:700;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:15px}.chips button.on{background:var(--cc,#0b6b4f);border-color:var(--cc,#0b6b4f);color:#fff}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #cfe0d6;border-radius:14px;padding:0 12px;margin-bottom:10px}.srch input{border:0;outline:0;background:transparent;padding:11px 0;width:100%;font-size:16px}
label{display:block;font-size:14.5px;font-weight:700;color:#26382f;margin:11px 0 4px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid #c9dbd0;border-radius:12px;padding:10px 12px;font-size:16px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(11,107,79,.15)}
input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid #c9dbd0;border-radius:12px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;padding:10px;font-weight:700;cursor:pointer;font-size:15.5px}.seg button.in.on{background:#117a3a;color:#fff}.seg button.out.on{background:var(--red);color:#fff}
/* fund */
.bal{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--pc),var(--pc2));box-shadow:var(--sh);margin-bottom:12px}.bal small{opacity:.92;font-size:14px}.bal .big{font-size:34px;font-weight:700;line-height:1.2}.bal .io{display:flex;gap:10px;margin-top:10px}.bal .io div{flex:1;background:rgba(255,255,255,.17);border-radius:12px;padding:8px 10px;font-size:13.5px}.bal .io b{display:block;font-size:18px}
.dh{font-size:13.5px;font-weight:700;color:var(--mut);margin:12px 4px 4px}
.amt{font-weight:700;white-space:nowrap;font-size:17px}.amt.in{color:#117a3a}.amt.out{color:var(--red)}
.dir{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}.dir.in{background:#e1f4e7;color:#117a3a}.dir.out{background:#fdeaea;color:var(--red)}
/* blood */
.bg{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#e53935,#b71c1c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;box-shadow:0 3px 8px rgba(183,28,28,.35)}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:#e1f4e7;color:#117a3a}.badge.am{background:#fff1d6;color:#a35c00}.badge.bl{background:#e3edfb;color:var(--blue)}.badge.gr{background:#eceff1;color:#455a64}
.stat{display:flex;gap:10px;margin-bottom:12px}.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:22px;color:var(--c,#0b6b4f)}.stat small{color:var(--mut);font-size:13px}
details.art{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--sh)}details.art summary{cursor:pointer;padding:12px 14px;font-weight:700;color:#8a5a00;list-style:none;display:flex;gap:8px;align-items:center}details.art summary::-webkit-details-marker{display:none}details.art[open] summary{border-bottom:1px solid #f0e3c0}details.art .bd{padding:12px 14px;white-space:pre-wrap;line-height:1.8}
.dd{display:flex;gap:12px;align-items:flex-start}.dbx{flex:none;width:58px;border-radius:14px;overflow:hidden;text-align:center;box-shadow:var(--sh);background:#fff;border:1px solid #f3d4b6}.dbx b{display:block;background:#e65100;color:#fff;font-size:13px;padding:2px 0}.dbx span{display:block;font-size:24px;font-weight:700;color:#bf360c;line-height:1.5}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,30,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:20px;margin:0 0 4px;color:#12352d}.sheet .x{float:right;border:0;background:#eef2f0;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:#12352d;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;max-width:90%;display:none;text-align:center}#toast.err{background:var(--red)}
.err{color:var(--red);font-size:14px;min-height:18px;margin-top:6px}
.sk{height:64px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,#e6efe9,#f3f8f5,#e6efe9);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* compact home v2 */
.hd{padding:10px 14px 14px}
.hd .top{gap:10px}
.hd .dt{flex:1;text-align:center;background:#fff;color:#0b4a37;border-radius:12px;padding:6px 8px;font-size:15px;font-weight:700;line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.18);border:1px solid #f1d98a}
.hd .dt small{display:block;font-size:13.5px;font-weight:600;color:#a47c00}
.lockb{flex:none}
.hd .main{margin-top:8px;gap:12px}
.ring{width:78px;height:78px;border-width:3px}
.ring img{width:56px;max-height:66px}
.hd .tag{font-size:12.5px}
.hd h1{font-size:25px}
.nbar{min-height:42px}
.tick span{font-size:15px}
.nbtn{font-size:14.5px;padding:0 10px;gap:5px}
.nbtn .i{width:17px;height:17px}
.grid{gap:10px;padding:10px 12px}
.tile{min-height:104px;padding:12px 6px 10px;gap:6px;font-size:16px;border-radius:18px}
.tile:before{height:5px}
.tile .ib{width:48px;height:48px}
.tile .ib .i{width:25px;height:25px}
.tile small{font-size:12px;margin-top:-2px}
.tile.s{min-height:88px;font-size:14px;padding:10px 3px 8px}
.tile.s .ib{width:40px;height:40px}
.tile.s .ib .i{width:21px;height:21px}
.sec{padding:2px 14px 0;margin:0}
.sec span{font-size:16px!important}
.foot{font-size:12px;padding:2px 12px 16px;line-height:1.5}
#printArea{display:none}.rp{font-family:'Noto Sans Bengali',sans-serif;color:#000;font-size:13px}.rp table{width:100%;border-collapse:collapse;margin:6px 0}.rp td,.rp th{border:1px solid #444;padding:4px 7px;text-align:left}.rp .r{text-align:right}.rp h4{margin:12px 0 2px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:8mm}html,body{background:#fff!important}}
@media(max-height:780px){.tile{min-height:90px;padding:8px 4px 8px}.tile .ib{width:42px;height:42px}.tile.s{min-height:76px}.tile.s .ib{width:34px;height:34px}.foot{padding:2px 16px 10px}}
html,body{touch-action:manipulation}

.av.ph{background:#fff;overflow:hidden;border:2px solid #e3b93c;padding:0}.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.rowb{cursor:pointer}.rowb:active{background:#f1f8f4}.rowb .info b{font-size:17px}.pdfi{font-size:20px;flex:none}
#pdfv{position:fixed;inset:0;z-index:2147483000;background:#e9efec;display:none;flex-direction:column}#pdfv.show{display:flex}
#pdfv .pb2{flex:none;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#10a070,#0a5c47);color:#fff;padding:9px 12px;border-bottom:3px solid #e3b93c}#pdfv .pb2 b{flex:1;font-size:16px;line-height:1.35;overflow:hidden;text-overflow:ellipsis}
#pdfv .pb2 button,#pdfv .pb2 a{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:10px;padding:6px 11px;font:700 13px inherit;text-decoration:none;cursor:pointer}
#pdfv .pgs{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}#pdfv canvas{display:block;width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#pdfv .msg{padding:26px 14px;text-align:center;color:#34453d;font-size:16px;line-height:1.7}

/* dark */
html.dk{filter:invert(1) hue-rotate(180deg);background:#fff}html.dk img,html.dk canvas,html.dk video,html.dk #pdfv canvas,html.dk .av.ph{filter:invert(1) hue-rotate(180deg)}html.dk .hd,html.dk .nbar,html.dk .pbar,html.dk .bal,html.dk .tile .ib,html.dk .fab,html.dk .bg,html.dk .av:not(.ph),html.dk .btn:not(.sec){filter:invert(1) hue-rotate(180deg)}
/* ---- কম্পিউটারের পূর্ণ পর্দা ---- */
@media(min-width:900px){
#app{max-width:none;width:100%}
.fab{right:28px;bottom:28px}
.grid.g2,.grid.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.hd{padding-left:max(24px,4vw);padding-right:max(24px,4vw)}
.modal{align-items:center}.sheet{max-width:720px;border-radius:22px}
.pbar{padding-left:max(16px,3vw);padding-right:max(16px,3vw)}
}
@media(min-width:1500px){html,body{font-size:17px}}

  var l=DB.people.filter(function(p){return p.grp===grp}).sort(function(a,b){return num(a.order||99)-num(b.order||99)||String(a.name).localeCompare(String(b.name))});
  var h='';
  if(!LOADED.people&&!l.length)h=skel();
  else if(!l.length)h='<div class="card empty">'+(ADMIN?'নিচের + বোতামে চাপ দিয়ে সদস্য যুক্ত করুন':'এখনও কোনো তথ্য যুক্ত করা হয়নি')+'</div>';
  else h='<div class="card">'+l.map(function(p){return'<div class="row rowb" data-a="person" data-id="'+p.id+'">'+avh(p)+'<div class="info"><b>'+esc(p.name)+'</b>'+(p.post?'<small>'+esc(p.post)+'</small>':'')+'</div>'+(pdfHas(p)?'<span class="pdfi" title="পিডিএফ আছে">📄</span>':'')+adminBtns('people',p.id)+'</div>'}).join('')+'</div>';
  return shell(grp,l.length?bn(l.length)+' জন':'',h,'add:people:'+grp);
}

/* ledger (main fund / welfare) */
function vFund(f){
  var all=DB.ledger.filter(function(x){return x.fund===f}),inn=0,out=0;
  all.forEach(function(x){if(x.type==='in')inn+=num(x.amt);else out+=num(x.amt)});
  var months={};all.forEach(function(x){months[(x.date||'').slice(0,7)]=1});var ml=Object.keys(months).sort().reverse();
  var l=all.filter(function(x){return(UIS.fl==='all'||x.type===UIS.fl)&&(!UIS.fm||(x.date||'').slice(0,7)===UIS.fm)}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))||b.ts-a.ts});
  var h='<div class="bal"><small>বর্তমান জমা (স্থিতি)</small><div class="big">'+money(inn-out)+'</div><div style="display:flex;gap:18px;margin-top:6px;font-size:14.5px"><span>⬇ মোট জমা: <b>'+money(inn)+'</b></span><span>⬆ মোট খরচ: <b>'+money(out)+'</b></span></div></div>';
  h+='<button class="btn full" data-a="payGo" data-v="'+f+'" style="margin-bottom:12px;background:#d81b60;font-size:17px">💳 অনলাইনে দান / অর্থ প্রদান</button>';
  if(f==='welfare'){h+='<div class="chips" style="margin-bottom:6px"><button data-a="wv" data-v="tx" style="'+(UIS.wv!=='mem'?'background:var(--pc);color:#fff;border-color:var(--pc)':'')+'">📒 লেনদেন</button><button data-a="wv" data-v="mem" style="'+(UIS.wv==='mem'?'background:var(--pc);color:#fff;border-color:var(--pc)':'')+'">👥 সদস্যদের জমা ও বাকি</button></div>';if(UIS.wv==='mem')return shell(f,bn(DB.wmembers.length)+' জন সদস্য',h+wmView(),'add:wmembers')}
  h+='<div class="chips"><button data-a="fl" data-v="all" class="'+(UIS.fl==='all'?'on':'')+'" style="'+(UIS.fl==='all'?'background:var(--pc);color:#fff;border-color:var(--pc)':'')+'">সব</button><button data-a="fl" data-v="in" style="'+(UIS.fl==='in'?'background:#117a3a;color:#fff;border-color:#117a3a':'')+'">জমা</button><button data-a="fl" data-v="out" style="'+(UIS.fl==='out'?'background:#c62828;color:#fff;border-color:#c62828':'')+'">খরচ</button></div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px"><select id="fmSel" style="flex:1"><option value="">সব মাস</option>'+ml.map(function(m){var a=m.split('-');return'<option value="'+m+'"'+(UIS.fm===m?' selected':'')+'>'+MN[+a[1]-1]+' '+bn(a[0])+'</option>'}).join('')+'</select><button class="btn sec" data-a="shareFund" data-v="'+f+'">'+ic('share')+' শেয়ার</button><button class="btn sec" data-a="report" data-v="'+f+'">📄 প্রতিবেদন পিডিএফ</button></div>'+(ADMIN&&f==='main'?'<button class="btn full" style="margin-bottom:10px;background:#2e7d32" data-go="members">👥 সদস্য ও মাসিক চাঁদা</button>':'');
  if(!LOADED.ledger&&!all.length)h+=skel();
  else if(!l.length)h+='<div class="card empty">'+(ADMIN?'নিচের + বোতামে চাপ দিয়ে লেনদেন যুক্ত করুন':'কোনো লেনদেন নেই')+'</div>';
  else{var last='',body='';l.forEach(function(x){if(x.date!==last){last=x.date;body+='<div class="dh">'+fdate(x.date)+'</div>'}body+='<div class="row"><div class="dir '+x.type+'">'+ic(x.type==='in'?'down':'up')+'</div><div class="info"><b>'+esc(x.name||x.cat||'—')+'</b><small>'+esc(x.cat||'')+(x.note?' • '+esc(x.note):'')+'</small></div><span class="amt '+(x.type==='in'?'in':'out')+'">'+(x.type==='in'?'+':'−')+' '+money(x.amt)+'</span>'+adminBtns('ledger',x.id,x.type==='in'?'<button class="ibtn" data-a="rcpt" data-id="'+x.id+'" aria-label="রসিদ">🧾</button>':'')+'</div>'});h+='<div class="card">'+body+'</div>'}
  return shell(f,bn(all.length)+'টি লেনদেন',h,'add:ledger:'+f);
}

/* ---------- welfare members ---------- */
function wmPaid(id){var s=0;DB.ledger.forEach(function(x){if(x.fund==='welfare'&&x.type==='in'&&x.wmid===id)s+=num(x.amt)});return s}
function wmMatch(fund,name){if(fund!=='welfare')return{};var n=String(name||'').trim().toLowerCase(),m=DB.wmembers.filter(function(x){return String(x.name).trim().toLowerCase()===n})[0];return m?{wmid:m.id}:{}}
function wmView(){
  var l=DB.wmembers.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))}),tp=0,td=0,tg=0;
  if(!LOADED.wmembers&&!l.length)return skel();
  if(!l.length)return'<div class="card empty">'+(ADMIN?'নিচের + বোতামে চাপ দিয়ে সদস্য যুক্ত করুন':'এখনও কোনো সদস্য যুক্ত করা হয়নি')+'</div>';
  var rows=l.map(function(m){var p=wmPaid(m.id),g=num(m.pledge),d=Math.max(0,g-p);tp+=p;tg+=g;td+=d;
    var st=g>0?(d>0?'<span class="badge am" style="background:#ffe9e7;color:#c62828">বাকি '+money(d)+'</span>':'<span class="badge">✅ পরিশোধিত</span>'):'';
    var bar=g>0?'<div style="height:6px;border-radius:99px;background:#e3ece7;margin-top:5px;overflow:hidden"><div style="height:100%;width:'+Math.min(100,Math.round(p*100/g))+'%;background:linear-gradient(90deg,#10a070,#0a6b4f)"></div></div>':'';
    return'<div class="row" style="align-items:flex-start"><div class="av" style="background:'+avc(m.name)+'">'+esc(String(m.name).trim().charAt(0))+'</div><div class="info"><b>'+esc(m.name)+'</b><small>জমা: <b style="display:inline;font-size:inherit;color:#117a3a">'+money(p)+'</b>'+(g>0?' • অঙ্গীকার: '+money(g):'')+'</small>'+(st?'<small>'+st+'</small>':'')+bar+(m.note?'<small>'+esc(m.note)+'</small>':'')+'</div>'+(ADMIN?'<div class="acts"><button class="ibtn" data-a="wmPay" data-id="'+m.id+'" aria-label="জমা গ্রহণ">💰</button><button class="ibtn" data-a="edit" data-col="wmembers" data-id="'+m.id+'" aria-label="সম্পাদনা">'+ic('edit')+'</button></div>':'')+'</div>'}).join('');
  var all=0;DB.ledger.forEach(function(x){if(x.fund==='welfare'&&x.type==='in')all+=num(x.amt)});
  return'<div class="bal" style="background:linear-gradient(135deg,#10a070,#0a5c47);margin-bottom:12px"><small>সদস্যদের মোট জমা</small><div class="big" style="font-size:30px;font-weight:800">'+money(tp)+'</div><div style="display:flex;gap:18px;margin-top:6px;font-size:14.5px;flex-wrap:wrap"><span>সদস্য: <b>'+bn(l.length)+' জন</b></span>'+(tg>0?'<span>মোট বাকি: <b>'+money(td)+'</b></span>':'')+(all-tp>0?'<span>অন্যান্য দান: <b>'+money(all-tp)+'</b></span>':'')+'</div></div><div class="card">'+rows+'</div>'
}
function shareFund(f){
  var inn=0,out=0;DB.ledger.forEach(function(x){if(x.fund===f){if(x.type==='in')inn+=num(x.amt);else out+=num(x.amt)}});
  var t='*হিলফুল ফুযুল একতা সংঘ — '+FUNDS[f].t+'*\n'+fdate(todayISO())+' পর্যন্ত\n\nমোট জমা: '+money(inn)+'\nমোট খরচ: '+money(out)+'\n*বর্তমান জমা: '+money(inn-out)+'*';
  if(navigator.share){navigator.share({text:t}).catch(function(){})}else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}

/* blood bank */
function eligible(b){if(b.avail===false)return{t:'অনুপলব্ধ',c:'gr'};if(!b.last)return{t:'রক্তদানে সক্ষম',c:''};var d=Math.floor((Date.now()-new Date(b.last+'T00:00:00').getTime())/86400000);return d>=90?{t:'রক্তদানে সক্ষম',c:''}:{t:'আরও '+bn(90-d)+' দিন পর',c:'am'}}
function bloodList(){
  var q=UIS.q.trim().toLowerCase(),l=DB.blood.filter(function(b){return(!UIS.bg||b.grp===UIS.bg)&&(!q||(b.name+' '+(b.area||'')+' '+(b.phone||'')).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){var ea=eligible(a).c===''?0:1,eb=eligible(b).c===''?0:1;return ea-eb||String(a.name).localeCompare(String(b.name))});
  if(!LOADED.blood&&!DB.blood.length)return skel();
  if(!l.length)return'<div class="card empty">'+(DB.blood.length?'এই শর্তে কোনো রক্তদাতা নেই':(ADMIN?'নিচের + বোতামে চাপ দিয়ে রক্তদাতা যুক্ত করুন':'এখনও কোনো রক্তদাতা যুক্ত করা হয়নি'))+'</div>';
  return'<div class="card">'+l.map(function(b){var e=eligible(b);return'<div class="row"><div class="bg">'+esc(b.grp)+'</div><div class="info"><b>'+esc(b.name)+'</b><small>'+(b.area?esc(b.area)+' • ':'')+(b.last?'সর্বশেষ: '+fdate(b.last):'রক্তদান: নেই')+'</small><small><span class="badge '+e.c+'">'+e.t+'</span></small></div>'+(b.phone?'<div class="acts"><a class="ibtn call" href="tel:'+esc(b.phone)+'" aria-label="কল">'+ic('phone')+'</a><a class="ibtn" href="https://wa.me/'+phoneWA(b.phone)+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+ic('wa')+'</a></div>':'')+adminBtns('blood',b.id)+'</div>'}).join('')+'</div>';
}

  var av=DB.blood.filter(function(b){return eligible(b).c===''}).length;
  var h='<div class="stat"><div><b>'+bn(DB.blood.length)+'</b>মোট রক্তদাতা</div><div><b style="color:#117a3a">'+bn(av)+'</b>এখন রক্তদানে সক্ষম</div></div>';
  h+='<div class="srch">'+ic('search')+'<input id="bq" placeholder="নাম / এলাকা / মোবাইল অনুসন্ধান করুন" value="'+esc(UIS.q)+'"></div>';

    case'toArch':var n=DB.notices.filter(function(x){return x.id===id})[0];if(n){ask('এই নোটিশটি আর্কাইভে স্থানান্তর করবেন?','হ্যাঁ, স্থানান্তর করুন',function(){put('archive',{title:n.title,body:n.body||'',date:n.date||todayISO(),cat:'নোটিশ (পুরোনো)'}).then(function(){return del('notices',id)}).then(function(){toast('আর্কাইভে স্থানান্তরিত হয়েছে')})})}break;
  }
});
document.addEventListener('input',function(e){if(e.target.id==='mq'){UIS.q=e.target.value;render();return}if(e.target.id==='bq'){UIS.q=e.target.value;$('#bList').innerHTML=bloodList()}});
document.addEventListener('change',function(e){if(e.target.id==='phFile'){phPick(e.target.files[0]);return}if(e.target.id==='pdfFile'){pdfPick(e.target.files[0]);return}if(e.target.id==='f_wmid'){var wm=DB.wmembers.filter(function(m){return m.id===e.target.value})[0],nn=$('#f_name');if(wm&&nn&&!nn.value.trim())nn.value=wm.name;return}if(e.target.dataset&&e.target.dataset.cm!==undefined){collectCalc();return}if(e.target.id==='mmSel'){UIS.mm=e.target.value||todayISO().slice(0,7);render();return}if(e.target.id==='fmSel'){UIS.fm=e.target.value;render()}});
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});

/* ---------- boot ---------- */
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.onload=res;s.onerror=function(){rej(new Error('net'))};document.head.appendChild(s)})}
function initFB(){
  var B='https://www.gstatic.com/firebasejs/10.14.1/';
  loadScript(B+'firebase-app-compat.js').then(function(){return loadScript(B+'firebase-auth-compat.js')}).then(function(){return loadScript(B+'firebase-firestore-compat.js')}).then(function(){
    firebase.initializeApp(CFG);auth=firebase.auth();fsdb=firebase.firestore();
    try{fsdb.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    try{fsdb.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    base=fsdb.collection('org').doc('main');online=true;listen();
    auth.onAuthStateChanged(function(u){ADMIN=!!u;if(u)ADMCOLS.forEach(sub);else unsubAdm();if(!ADMIN&&(cur==='members'||cur==='log'||cur==='payreq'||cur==='bloodreq')){cur='home';history.replaceState(null,'','#')}render()});
  }).catch(function(){online=false;toast('ইন্টারনেট সংযোগ নেই — সর্বশেষ সংরক্ষিত তথ্য দেখানো হচ্ছে',true)});
}
document.addEventListener('gesturestart',function(e){e.preventDefault()});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
window.__ORG={DB:DB,UIS:UIS,go:go,render:render,info:info};
applyPref();cur=parseHash();render();initFB();
})();
</script>
